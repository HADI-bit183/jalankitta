<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://server.arcgisonline.com https://unpkg.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://router.project-osrm.org; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Login - JalanKitta</title>
  <meta name="theme-color" content="#0F172A" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/logo-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/logo-192.png" />
  
  <script>
    (function() {
      const t = localStorage.getItem('theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js" integrity="sha384-0v3Wh0ZtiQBYCYywQoeMDA5mAw5Z01p0lhorqy0BlwFrcN6u3lmN7K0U/e1uezmr" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/tailwind.css" />
  <style>
    html.dark .text-navy { color: #f8fafc; }
    html.dark .text-ink { color: #94a3b8; }
    html.dark input { background: rgba(255,255,255,.06) !important; border-color: rgba(255,255,255,.12) !important; color: #f8fafc !important; }
    html.dark #btn-submit-auth { background: linear-gradient(135deg,#f59e0b,#ea580c); color: #fff; }
  </style>
</head>
<body class="font-sans antialiased selection:bg-amber-500/30 flex min-h-screen">
  <a href="#main-content" class="skip-link">Lewati ke konten utama</a>

  <div class="aurora-mesh">
    <div class="aurora-orb-1"></div>
    <div class="aurora-orb-2"></div>
  </div>
  
  <main id="main-content" tabindex="-1" class="relative z-10 flex flex-1 w-full m-0 p-0">
    <div class="grid w-full lg:grid-cols-2 overflow-hidden">
      
      <!-- Kolom Kiri: Ilustrasi -->
      <div class="hidden lg:flex relative bg-gradient-to-br from-amber-50 via-orange-50 to-amber-100 items-center justify-center p-12 overflow-hidden">
        <!-- Dekorasi Latar Belakang -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjIiIGZpbGw9IiNGMUE1MDEiIGZpbGwtb3BhY2l0eT0iMC4xNSIvPjwvc3ZnPg==')] opacity-50"></div>
        <div class="absolute top-[-20%] left-[-20%] w-96 h-96 bg-white/40 rounded-full blur-3xl"></div>
        
        <!-- Ilustrasi Utama -->
        <!-- Memakai mix-blend-multiply agar background putih dari gambar hero-worker.webp bisa menyatu dengan bg-soft -->
        <img id="hero-worker-img" src="assets/img/hero-worker.webp" alt="Pekerja Jalan" class="relative z-10 w-full max-w-md object-contain mix-blend-multiply animate-float" />
      </div>

      <!-- Kolom Kanan: Form Login -->
      <div class="login-right flex items-center justify-center p-8 sm:p-14 relative bg-white/70 dark:bg-slate-900/60 backdrop-blur-xl">
        <a href="index.html" class="absolute left-6 top-6 sm:left-10 sm:top-10 text-ink hover:text-navy transition flex items-center gap-2 text-sm font-bold"><i data-lucide="arrow-left" class="h-4 w-4"></i> Kembali</a>
        <button id="dark-toggle" class="absolute right-6 top-6 sm:right-10 sm:top-10 flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200/80 dark:border-white/10 bg-white/60 dark:bg-slate-800/80 text-slate-700 dark:text-amber-400 shadow-sm transition hover:scale-105 active:scale-95" title="Ganti Tema (Gelap / Terang)" aria-label="Toggle Dark Mode">
          <i data-lucide="sun" class="h-5 w-5 hidden dark:block"></i>
          <i data-lucide="moon" class="h-5 w-5 block dark:hidden"></i>
        </button>
        
        <div class="w-full max-w-sm mt-10 sm:mt-0">
          <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-3.5 mb-8 group">
              <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-amber-500/10 dark:bg-white/10 p-1.5 shadow-md shadow-amber-500/20 transition-transform group-hover:scale-105">
                <img src="assets/img/logo-icon.png" alt="Logo JalanKitta" class="h-9 w-9 object-contain" />
              </div>
              <span class="font-logo text-3xl font-bold tracking-tight text-navy">Jalan<span class="bg-gradient-to-r from-amber-500 to-orange-500 bg-clip-text text-transparent">Kitta</span></span>
            </a>
            <h2 id="auth-title" class="font-display text-3xl font-bold text-navy">Login</h2>
            <p id="auth-subtitle" class="mt-2 text-[15px] text-ink">Masuk untuk melaporkan kerusakan jalan</p>
          </div>

          <form id="auth-form" class="space-y-5">
            <div id="field-nama" class="hidden">
              <label class="mb-1.5 block text-sm font-bold text-navy">Nama Lengkap</label>
              <input type="text" id="auth-nama" maxlength="100" placeholder="Nama lengkap Anda" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-navy outline-none focus:border-accent focus:bg-white focus:ring-4 focus:ring-accent/20 transition" />
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-bold text-navy">Email</label>
              <input type="email" id="auth-email" required placeholder="nama@email.com" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-navy outline-none focus:border-accent focus:bg-white focus:ring-4 focus:ring-accent/20 transition" />
            </div>
            <div>
              <label class="mb-1.5 block text-sm font-bold text-navy">Password</label>
              <input type="password" id="auth-password" required minlength="6" placeholder="Minimal 6 karakter" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-navy outline-none focus:border-accent focus:bg-white focus:ring-4 focus:ring-accent/20 transition" />
            </div>
            
            <div class="flex justify-end" id="field-forgot">
              <button type="button" id="btn-forgot-password" class="text-xs font-bold text-ink hover:text-accent transition">Lupa password?</button>
            </div>
            
            <p id="auth-error" class="hidden text-sm text-major bg-major/10 p-4 rounded-xl font-bold text-center"></p>
            
            <button type="submit" id="btn-submit-auth" class="glow-btn-primary w-full rounded-xl px-4 py-4 mt-2 font-bold text-white shadow-lg disabled:opacity-70 disabled:cursor-wait">
              Login
            </button>
          </form>

          <p class="mt-8 text-center text-[15px] text-ink">
            <span id="auth-switch-text">Belum punya akun?</span>
            <button id="btn-switch-auth" class="font-bold text-accent hover:underline ml-1">Daftar sekarang</button>
          </p>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    lucide.createIcons();
    const heroImg = document.getElementById('hero-worker-img');
    if (heroImg) heroImg.addEventListener('error', () => { heroImg.style.display = 'none'; });
    document.getElementById('dark-toggle').addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
